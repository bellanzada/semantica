<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semântica</title>
    <link rel="stylesheet" href="aula10.css">
</head>


<body>
    <!--
    Semântica: é a parte linguística que estuda o significado e sentido das palavras!
    A partir da versão 5 do HTML, surgiram as tags semânticas que descrevem o significado
    da parte do seu site para o navegador e outros desenvolvedores entenderem!
  -->

    <header style="background-color: rgb(0, 0, 0); height: 10vh; border-bottom: 3px solid rgb(255, 215, 0); display: flex; align-items: center; justify-content: center;"> <!-- cabeçalho da pagina -->

        <nav style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; height: 100%; gap: 8px;">
            <h1 style="color: rgb(255, 215, 0); font-size: 32px; margin: 0; letter-spacing: 3px;">TESLA</h1>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <a href=""><button class='btnnav'>Home</button></a>
                <a href=""><button class='btnnav'>Sobre Nos</button></a>
                <a href=""><button class='btnnav'>Trabelhe conosco</button></a>
            </div>
        </nav>
    </header>

    <main style="background-color: rgb(20, 20, 20); height: 70vh; display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; padding: 20px;">
        <!-- Conteúdo principal, é onde irão as informações do site em si -->
        <div style="width: 45%; height: 80%; display: flex; justify-content: center; align-items: center;">
            <div class="card">
                <h4>Autobot</h4>
                <img src="https://pngimg.com/uploads/transformers/transformers_PNG6.png" alt="Autobot" height="280" width="280">
                <p>$: 999999.99</p>
            </div>
        </div>

        <div style="width: 45%; height: 80%; display: flex; justify-content: center; align-items: center;">
            <div class="card">
                <h4>Decepticon</h4>
                <img src="https://pngimg.com/uploads/transformers/transformers_PNG15.png" alt="Decepticon" height="280" width="280">
                <p>$: 999999.99</p>
            </div>
        </div>
    </main>

    <footer style="background-color: rgb(0, 0, 0); height: 20vh; border-top: 3px solid rgb(255, 215, 0); display: flex; align-items: center; justify-content: center;">
        <!-- Footer, é o rodapé da páginaFooter , é o rodapé da página -->
        <nav style="display: flex; justify-content: center; align-items: center; gap: 20px; height: 100%; flex-wrap: wrap;">
            <a href="https://www.facebook.com" target="_blank"> <button class="btnfooter"> <img
                        src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"
                        style="height: 30px;"> Facebook </button> </a>
            <a href="https://www.instagram.com" target="_blank"> <button class="btnfooter"> <img
                        src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"
                        style="height: 30px;"> Instagram </button> </a>
            <a href="https://www.twitter.com" target="_blank"> <button class="btnfooter"> <img
                        src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" style="height: 30px;">
                    Twitter </button> </a>
        </nav>
    </footer>
</body>

</html>
